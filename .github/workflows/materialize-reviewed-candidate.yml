name: Materialize reviewed release candidate
on:
  push:
    branches: [release/1.0.0-core-media-client]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.repository == 'CineHarbor/cineharbor-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact checkpointed candidate on its preparation branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'd51414bba4964dd7cee02780e41c73e35190ce76'
          branch = 'release/1.0.0-core-media-client'
          helper = '.github/workflows/materialize-reviewed-candidate.yml'
          assert os.environ['GITHUB_REPOSITORY'] == 'CineHarbor/cineharbor-core'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert git('rev-parse', 'HEAD^') == base, 'AGNIR_CHECKPOINT_CONFLICT: unexpected parent'
          assert git('diff', '--name-only', 'HEAD^', 'HEAD') == helper
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base, 'AGNIR_CHECKPOINT_CONFLICT: main advanced'
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == os.environ['GITHUB_SHA'], 'branch advanced'
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '54eb90a670a36235a42a05ad62d2e876e632cb86702fdc992c10f6200dd6aee4'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          subprocess.run(['git', 'rm', helper], check=True)
          assert git('write-tree') == '8f9f6be0ad8f5e20f2dbf3525d4f4fb4d1dde3fd', 'candidate tree mismatch'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(release): apply reviewed media-client alignment and retire transport'], check=True)
          subprocess.run(['gh', 'auth', 'setup-git'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == git('rev-parse', 'HEAD')
          print('VERIFIED_CANDIDATE=' + git('rev-parse', 'HEAD'))
          print('VERIFIED_TREE=' + git('write-tree'))
