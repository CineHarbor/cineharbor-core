name: ci

on:
  push:
    branches: [main, desktop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Rust ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: ["fmt", "check", "test", "clippy", "wasm"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned sibling dependency
        run: python3 scripts/ci-checkout.py
      - name: Select pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.gate }}
      - name: Execute required gate
        shell: bash
        run: |
          set -euo pipefail
          echo "Source: $GITHUB_REPOSITORY@$GITHUB_SHA"
          case "${{ matrix.gate }}" in
            fmt) python3 scripts/format-owned.py --check ;;
            check) cargo check --workspace --all-targets --locked ;;
            test) cargo test --workspace --all-targets --all-features --locked && cargo test --workspace --doc --all-features --locked ;;
            clippy) cargo clippy --workspace --all-targets --all-features --locked -- -D warnings ;;
            wasm)
              cargo check -p cineharbor-core --no-default-features --target wasm32-unknown-unknown --locked
              cargo build -p cineharbor-core-web --target wasm32-unknown-unknown --release --locked
              ;;
            *) echo 'Unknown gate' >&2; exit 1 ;;
          esac
